services:
  postgres:
    image: postgres:16-alpine
    container_name: secdb-postgres
    environment:
      POSTGRES_USER: secdb
      POSTGRES_PASSWORD: secdb
      POSTGRES_DB: secdb
    ports:
      - "5432:5432"
    volumes:
      - secdb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secdb -d secdb"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  secdb-postgres-data:
