    application_label: Data Platform
    repo: event-pipeline
    sonar_projects: [ExampleOrg_event-pipeline]
    wiz_service: event-pipeline
    teams: [data-engineering]
    views: [developer, executive]
    dev_pillar: data
  - key: analytics-api
    label: Analytics API
