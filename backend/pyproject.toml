[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secdb"
version = "0.1.0"
description = "Unified Security Dashboard backend (API, normalizer, pollers, CLI)"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.14.2",
  "click>=8.1",
  "google-auth>=2.35",
  "google-cloud-pubsub>=2.27",
  "google-cloud-storage>=2.18",
  "google-cloud-secret-manager>=2.21",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "structlog>=24.4",
  "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "respx>=0.21",
]

[project.scripts]
secdb = "app.cli.main:main"
secdb-migrate = "app.migrate:main"
secdb-poller-dependabot = "app.pollers.dependabot:main"
secdb-poller-sonarcloud = "app.pollers.sonarcloud:main"
secdb-poller-wiz = "app.pollers.wiz:main"
secdb-poller-jira-pentest = "app.pollers.jira_pentest:main"
secdb-mcp = "app.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
