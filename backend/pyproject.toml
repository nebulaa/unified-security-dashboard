[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secdb"
version = "0.1.0"
description = "Unified Security Dashboard backend (API, normalizer, pollers, CLI)"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy>=2.1.4",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.15.0",
  "click>=8.5.0",
  "google-auth>=2.61.0",
  "google-cloud-pubsub>=2.42.0",
  "google-cloud-storage>=3.17.0",
  "google-cloud-secret-manager>=2.31.0",
  "httpx>=0.28.1",
  "PyYAML>=6.0.3",
  "structlog>=26.1.0",
  "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.17.0",
  "mypy>=2.4.0",
  "types-PyYAML",
  "respx>=0.23.1",
]

[project.scripts]
secdb = "app.cli.main:main"
secdb-migrate = "app.migrate:main"
secdb-poller-dependabot = "app.pollers.dependabot:main"
secdb-poller-sonarcloud = "app.pollers.sonarcloud:main"
secdb-poller-wiz = "app.pollers.wiz:main"
secdb-poller-jira-pentest = "app.pollers.jira_pentest:main"
secdb-mcp = "app.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
